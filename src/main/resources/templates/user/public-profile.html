<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${targetUser.name + ' - Profile'}">User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body { background-color: #f5f1eb; color: #2d3748; }
        .profile-card { background: #fff; border-radius: 20px; overflow: hidden; border: 1px solid #edf2f7; }
        .profile-cover { height: 130px; background: linear-gradient(135deg, #2b1b17 0%, #6b4423 100%); }
        .profile-avatar { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 4px solid #fff; margin-top: -50px; }
        .post-card { background: #fff; border-radius: 16px; border: 1px solid #edf2f7; margin-bottom: 20px; padding: 20px; }
        .book-cover-mini { width: 36px; height: 50px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 960px;">
    <!-- Back Button -->
    <button type="button" onclick="history.back()" class="btn btn-sm btn-light border rounded-pill px-3 mb-3 fw-semibold">
        <i class="fa-solid fa-arrow-left me-1"></i> Back
    </button>

    <div class="row g-4">
        <!-- Target User Profile Info -->
        <div class="col-lg-4">
            <div class="profile-card text-center pb-4">
                <div class="profile-cover"></div>
                <img th:if="${targetUser.profileImageUrl != null && !targetUser.profileImageUrl.empty}" 
                     th:src="${targetUser.profileImageUrl}" class="profile-avatar" th:onclick="showModal([[${targetUser.profileImageUrl}]])">
                <img th:unless="${targetUser.profileImageUrl != null && !targetUser.profileImageUrl.empty}" 
                     src="https://api.dicebear.com/7.x/bottts/svg?seed=Reader" class="profile-avatar">

                <h5 class="fw-bold mt-2 mb-0 d-flex align-items-center justify-content-center gap-1">
                    <span th:text="${targetUser.name}">User Name</span>
                    <i th:if="${targetUser.isPremium}" class="fa-solid fa-crown text-warning fs-6"></i>
                </h5>
                <p class="text-muted small mb-2" th:text="${targetUser.email}">email</p>
                <p class="small text-secondary mb-3 px-3" th:text="${targetUser.bio != null && !targetUser.bio.empty ? targetUser.bio : 'No bio available.'}">Bio</p>
                <!-- Stats -->
                <div class="row g-2 px-3">
                    <div class="col-6">
                        <div class="bg-light p-2 rounded-3 border">
                            <h6 class="fw-bold mb-0" th:text="${userPosts.size()}">0</h6>
                            <small class="text-muted" style="font-size: 0.75rem;">Posts</small>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="bg-light p-2 rounded-3 border">
                            <h6 class="fw-bold mb-0 text-danger" th:text="${totalLikesReceived}">0</h6>
                            <small class="text-muted" style="font-size: 0.75rem;">Likes</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Target User Posts List -->
        <div class="col-lg-8">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-clone me-2"></i>Posts by <span th:text="${targetUser.name}">User</span></h5>

            <div th:if="${#lists.isEmpty(userPosts)}" class="post-card text-center py-5">
                <p class="text-muted mb-0">No posts shared yet.</p>
            </div>

            <div th:each="post : ${userPosts}" class="post-card">
                <!-- Clickable Content to Detail Discussion -->
                <!-- <a th:href="@{/user/books/detail/{id}(id=${post.book.id})}" class="text-decoration-none text-dark">
                    <p class="mb-3 lh-base" th:text="${post.caption}">Post Caption</p>

                    
                    <div th:if="${post.book != null}" class="p-2 rounded-3 mb-3 d-inline-flex align-items-center gap-2" style="background: #faf7f2; border: 1px solid #e8dec8;">
                        <img th:if="${post.book.coverImageUrl != null && !post.book.coverImageUrl.empty}" th:src="${post.book.coverImageUrl}" class="book-cover-mini">
                        <div>
                            <div class="fw-bold small" th:text="${post.book.title}">Title</div>
                            <small class="text-muted" style="font-size: 0.75rem;" th:text="${post.book.author}">Author</small>
                        </div>
                    </div>
                </a> -->
                <!-- ၁။ Post Caption (နှိပ်လိုက်ရင် Post/Discussion Detail ဆီ သွားမည်) -->
<a th:href="@{/user/feed/discussion/{id}(id=${post.id})}" class="text-decoration-none text-dark d-block mb-3">
    <p class="mb-0 lh-base" th:text="${post.caption}">
        Post Caption
    </p>
</a>

<!-- ၂။ Mention ခေါ်ထားသော Book ပါမှသာ ဒီအပိုင်းကို ပြသမည် (th:if စစ်ထားပါသည်) -->
<div th:if="${post.book != null}" class="mb-3">
    <a th:href="@{/user/books/detail/{id}(id=${post.book.id})}" class="text-decoration-none d-inline-block">
        <div class="p-2 rounded-3 d-flex align-items-center gap-2" style="background: #faf7f2; border: 1px solid #e8dec8;">
            
            <!-- Book Cover Image -->
            <img th:if="${post.book.coverImageUrl != null && !post.book.coverImageUrl.empty}"
                 th:src="${post.book.coverImageUrl}"
                 class="book-cover-mini" style="width: 36px; height: 50px; object-fit: cover; border-radius: 4px;"
                 alt="Book Cover" />
            <img th:unless="${post.book.coverImageUrl != null && !post.book.coverImageUrl.empty}"
                 src="https://via.placeholder.com/36x50?text=Book"
                 class="book-cover-mini" style="width: 36px; height: 50px; object-fit: cover; border-radius: 4px;"
                 alt="Default Cover" />

            <div>
                <span class="d-block fw-bold text-dark small" th:text="${post.book.title}">
                    Book Title
                </span>
                <small class="text-muted" style="font-size: 0.75rem" th:text="${post.book.author}">
                    Author Name
                </small>
            </div>

        </div>
    </a>
</div>

                <!-- Likes & Comments -->
                <div class="d-flex gap-3 text-muted small pt-2 border-top">
                    <button type="button" class="btn btn-link p-0 text-decoration-none action-btn toggle-like-btn" th:data-post-id="${post.id}">
                        <i class="fa-heart me-1" th:id="'like-icon-' + ${post.id}"
                           th:classappend="${likedPostIds != null && likedPostIds.contains(post.id)} ? 'fas text-danger' : 'far text-secondary'"></i>
                        <span th:id="'like-count-' + ${post.id}" th:text="${post.likes != null ? post.likes.size() : 0}">0</span> Likes
                    </button>
                    <a th:href="@{/user/feed/discussion/{id}(id=${post.id})}" class="text-decoration-none text-muted">
                        <i class="fa-regular fa-comment me-1"></i><span th:text="${post.comments != null ? post.comments.size() : 0}">0</span> Comments
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>


    <!-- Image Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header border-0">
                    <h5 class="modal-header-title fw-bold">Profile Picture</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center p-0 pb-4">
                    <img id="modalImage" src="" class="img-fluid rounded-3 shadow-sm" style="max-height: 500px;" alt="Full Receipt">
                </div>
            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll('.toggle-like-btn').forEach(button => {
        button.addEventListener('click', function () {
            const postId = this.getAttribute('data-post-id');
            const icon = document.getElementById('like-icon-' + postId);
            const countSpan = document.getElementById('like-count-' + postId);

            // Fetch API ဖြင့် Reload မဖြစ်ဘဲ Request ပို့ခြင်း
            fetch(`/user/feed/like/${postId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                return response.json();
            })
            .then(data => {
                if (data) {
                    // Like/Unlike ပေါ်မူတည်ပြီး Icon အရောင်ပြောင်းခြင်း
                    if (data.liked) {
                        icon.classList.remove('far', 'text-secondary');
                        icon.classList.add('fas', 'text-danger');
                    } else {
                        icon.classList.remove('fas', 'text-danger');
                        icon.classList.add('far', 'text-secondary');
                    }
                    // Like အရေအတွက်ကို တိုက်ရိုက် update လုပ်ခြင်း
                    countSpan.innerText = data.count;
                }
            })
            .catch(error => console.error('Error toggling like:', error));
        });
    });
});
// for image view modal
function showModal(imageUrl) {
            document.getElementById('modalImage').src = imageUrl;
            var myModal = new bootstrap.Modal(document.getElementById('imageModal'));
            myModal.show();
        }

</script>

</body>
</html>
