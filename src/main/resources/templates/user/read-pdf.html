<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Read PDF - [[${book.title}]]</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

    <div class="container py-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 th:text="${book.title}">Book Title</h3>
            <div>
                <!-- Direct URL အစား Backend Controller ရဲ့ Download Endpoint ကို လှမ်းခေါ်ခြင်း -->
                <a th:href="@{/user/books/download/{id}(id=${book.id})}" class="btn btn-outline-light me-2">
                    📥 Download PDF
                </a>
                
                <a sec:authorize="hasRole('USER')" href="/user/home" class="btn btn-light">Back to Home</a>
                <a sec:authorize="hasRole('ADMIN')" onclick="history.back()" class="btn btn-light">Back </a>
            </div>
        </div>

        <!-- PDF Viewer (ဒီနေရာမှာတော့ ဖတ်လို့ရအောင် direct URL ကိုပဲ ဆက်ထားပေးထားပါတယ်) -->
        <div style="height: 85vh;">
            <object th:data="${book.pdfFileUrl}" type="application/pdf" width="100%" height="100%">
                <p>Your browser does not support PDF viewing.
                    <a th:href="@{/user/books/download/{id}(id=${book.id})}">Click here to download the PDF.</a>
                </p>
            </object>
        </div>
    </div>

</body>

</html>
