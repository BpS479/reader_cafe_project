<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Discussion | Reader Cafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        body { background: #f4efe9; color: #3c2b20; font-family: 'DM Sans', sans-serif; padding-bottom: 100px; }
        .wrapper { max-width: 750px; margin: 30px auto; padding: 0 15px; }
        .card-custom { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 8px 25px rgba(60,43,32,0.06); margin-bottom: 25px; }
        
        .avatar-circle { width: 40px; height: 40px; border-radius: 50%; background: #e8ded5; color: #402b1e; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .avatar-small { width: 32px; height: 32px; font-size: 12px; }
        
        .comment-box { background: #f8f4f0; border-radius: 18px; padding: 10px 16px; display: inline-block; max-width: 90%; }
        .reply-wrapper { margin-left: 48px; border-left: 2px solid #e8ded5; padding-left: 12px; margin-top: 10px; }

        /* Facebook Style Sticky Bottom Comment Bar */
        .sticky-comment-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #ffffff; box-shadow: 0 -5px 25px rgba(60,43,32,0.1);
            padding: 15px 0; z-index: 1000; border-top: 1px solid #eae0d8;
        }
        .sticky-comment-container { max-width: 750px; margin: 0 auto; padding: 0 15px; }

        .btn-theme { background: #402b1e; color: white; border-radius: 20px; font-weight: 600; }
        .btn-theme:hover { background: #5a4030; color: white; }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Navigation Back -->
    <a sec:authorize="hasRole('USER')" th:href="@{/user/feed}" class="btn btn-sm btn-outline-dark rounded-pill mb-3">
        <i class="fas fa-arrow-left me-1"></i> Back to Feed
    </a>
    <a sec:authorize="hasRole('ADMIN')"  onclick="history.back()" class="btn btn-sm btn-outline-dark rounded-pill mb-3">
        <i class="fas fa-arrow-left me-1"></i> Back 
    </a>

    <!-- 1. MAIN POST CARD -->
    <div class="card-custom">
        <div class="d-flex align-items-center gap-3 mb-3">
            <!-- <div class="avatar-circle"><i class="fas fa-user"></i></div> -->
             <!-- User Avatar Link -->
            <a th:href="@{/user/profile/{id}(id=${post.user.id})}">
                <img th:if="${post.user.profileImageUrl != null && !post.user.profileImageUrl.empty}" 
                   th:src="${post.user.profileImageUrl}" class="rounded-circle" style="width: 40px; height: 40px; object-fit: cover;">
                <img th:unless="${post.user.profileImageUrl != null && !post.user.profileImageUrl.empty}" 
                    src="https://api.dicebear.com/7.x/bottts/svg?seed=Reader" class="rounded-circle" style="width: 40px; height: 40px; object-fit: cover;">
            </a>
            <div>
                <h6 class="mb-0 fw-bold" th:text="${post.user.name != null ? post.user.name : post.user.email}">Name</h6>
                <small class="text-muted" th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy, hh:mm a')}">Time</small>
            </div>
        </div>
        <p class="fs-6 text-dark mb-0" style="white-space: pre-line;" th:text="${post.caption}">Caption</p>
    </div>

    <!-- 2. COMMENTS SECTION -->
    <div class="card-custom">
        <!-- Header with Refresh Reload Button -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold m-0" style="font-family: 'Playfair Display', serif;">Discussion Comments</h5>
            <button onclick="location.reload();" class="btn btn-sm btn-outline-secondary rounded-circle" title="Reload Comments">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(comments)}" class="text-center text-muted my-4">
            <i class="far fa-comments fa-2x mb-2"></i>
            <p class="small mb-0">No comments yet. Start the conversation below!</p>
        </div>

        <!-- Comment List -->
        <div th:each="comment : ${comments}" class="mb-4">
            <div class="d-flex gap-3">
                <!-- <div class="avatar-circle"><i class="fas fa-user"></i></div> -->
                <!-- User Avatar Link -->
                <a th:href="@{/user/profile/{id}(id=${comment.user.id})}">
                    <img th:if="${comment.user.profileImageUrl != null && !comment.user.profileImageUrl.empty}" 
                         th:src="${comment.user.profileImageUrl}" class="rounded-circle" style="width: 40px; height: 40px; object-fit: cover;">
                    <img th:unless="${comment.user.profileImageUrl != null && !comment.user.profileImageUrl.empty}" 
                         src="https://api.dicebear.com/7.x/bottts/svg?seed=Reader" class="rounded-circle" style="width: 40px; height: 40px; object-fit: cover;">
                </a>
                <div class="w-100">
                    <!-- Main Comment Content -->
                    <div class="comment-box">
                        <strong class="d-block text-dark small fw-bold" th:text="${comment.user.name != null ? comment.user.name : comment.user.email}">User</strong>
                        <span class="text-dark fs-6" th:text="${comment.content}">Content</span>
                    </div>
                    
                    <!-- Actions (Time & Reply Button) -->
                    <div class="mt-1 ms-2 d-flex align-items-center gap-3">
                        <small class="text-muted" style="font-size: 0.75rem;" th:text="${#temporals.format(comment.createdAt, 'hh:mm a')}">Time</small>
                        <button class="btn btn-link btn-sm p-0 text-decoration-none text-dark fw-bold small" 
                                type="button" th:data-bs-toggle="'collapse'" th:data-bs-target="'#replyForm-' + ${comment.id}">
                            Reply
                        </button>
                    </div>

                    <!-- Collapsible Reply Form -->
                    <div class="collapse mt-2 ms-2" th:id="'replyForm-' + ${comment.id}">
                        <form th:action="@{/user/feed/comment/add}" method="post" class="d-flex gap-2">
                            <input type="hidden" name="postId" th:value="${post.id}" />
                            <input type="hidden" name="parentId" th:value="${comment.id}" />
                            <input type="text" name="content" class="form-control form-control-sm rounded-pill" placeholder="Write a reply..." required />
                            <button type="submit" class="btn btn-sm btn-theme rounded-pill px-3">Reply</button>
                        </form>
                    </div>

                    <!-- 3. FOLDED REPLIES SECTION (FB Style Collapse) -->
                    <div th:if="${not #lists.isEmpty(comment.replies)}" class="mt-2 ms-2">
                        <!-- Fold Trigger Button -->
                        <button class="btn btn-link btn-sm text-decoration-none p-0 fw-bold text-muted small" 
                                type="button" th:data-bs-toggle="'collapse'" th:data-bs-target="'#repliesWrapper-' + ${comment.id}">
                            <i class="fas fa-reply fa-rotate-180 me-1"></i> 
                            View <span th:text="${#lists.size(comment.replies)}">0</span> replies
                        </button>

                        <!-- Folded Replies Container -->
                        <div class="collapse reply-wrapper" th:id="'repliesWrapper-' + ${comment.id}">
                            <div th:each="reply : ${comment.replies}" class="d-flex gap-2 mt-2">
                                <div class="avatar-circle avatar-small"><i class="fas fa-user"></i></div>
                                <div class="comment-box bg-light py-1 px-3">
                                    <strong class="d-block text-dark small" style="font-size: 0.75rem;" th:text="${reply.user.name != null ? reply.user.name : reply.user.email}">User</strong>
                                    <span class="text-dark small" th:text="${reply.content}">Reply Content</span>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- 4. FB STYLE STICKY BOTTOM COMMENT INPUT BAR -->
<div class="sticky-comment-bar">
    <div class="sticky-comment-container">
        <form th:action="@{/user/feed/comment/add}" method="post" class="d-flex gap-2 align-items-center">
            <input type="hidden" name="postId" th:value="${post.id}" />
            <input type="text" name="content" class="form-control rounded-pill bg-light border-0 py-2 px-3" placeholder="Write a comment..." required />
            <button type="submit" class="btn btn-theme rounded-circle px-3 py-2" title="Send Comment">
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
