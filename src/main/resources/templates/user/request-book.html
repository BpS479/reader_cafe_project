<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Request a Book - Reader Cafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Request a New Book</h4>
            </div>
            <div class="card-body">
                <form action="/user/request/save" method="post" th:object="${bookRequest}">

                    <div class="mb-3">
                        <label class="form-label">Book Title (စာအုပ်အမည်)</label>
                        <input type="text" name="bookTitle" class="form-control" placeholder="Enter book title"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Author Name (စာရေးဆရာ)</label>
                        <input type="text" name="authorName" class="form-control" placeholder="Enter author name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message / Note (အကြောင်းအရာ/မှတ်ချက်)</label>
                        <textarea name="message" class="form-control" rows="4"
                            placeholder="Why do you want this book or any specific edition?"></textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/user/home" class="btn btn-secondary">Back to Home</a>
                        <button type="submit" class="btn btn-success">Send Request</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

</body>

</html>
