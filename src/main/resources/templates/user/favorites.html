<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Favorite Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold"><i class="bi bi-heart-fill text-danger me-2"></i>My Favorite Books</h3>
            <a th:href="@{/user/home}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Back to Home
            </a>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-4">
            <div class="col" th:each="fav : ${favorites}">
                <div class="card h-100 shadow-sm border-0 rounded-3">
                    <img th:src="${fav.book.coverImageUrl != null ? fav.book.coverImageUrl : 'https://via.placeholder.com/200x250'}"
                        class="card-img-top" style="height: 220px; object-fit: cover;" alt="Cover">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div>
                            <h6 class="fw-bold text-truncate" th:text="${fav.book.title}">Title</h6>
                            <p class="text-muted small text-truncate" th:text="${fav.book.author}">Author</p>
                        </div>
                        <div class="d-flex gap-2 mt-2">
                            <a th:href="@{/user/books/read/{id}(id=${fav.book.id})}"
                                class="btn btn-primary btn-sm flex-grow-1">Read</a>

                            <!-- Remove Favorite -->
                            <form th:action="@{/user/books/favorite/{id}(id=${fav.book.id})}" method="post">
                                <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(favorites)}" class="text-center py-5">
            <i class="bi bi-heartbreak fs-1 text-muted"></i>
            <p class="text-muted mt-2">No favorite books added yet.</p>
        </div>
    </div>

</body>

</html>
