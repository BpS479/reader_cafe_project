<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader Cafe - Home</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>

    <style>
        .book-card-img {
            height: 250px;
            object-fit: cover;
        }

        .card-custom {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            border-radius: 12px;
        }

        .card-custom:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body class="bg-light">
    <nav class="navbar sticky-top navbar-expand-lg navbar-light mb-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Book Catalog</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fa-solid fa-bars"
                                style="color: rgb(255, 212, 59);"></i>Menu</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            Dropdown
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Disabled</a>
                    </li>
                </ul>
                <!-- <form class="d-flex">
                    <input class="form-control me-5" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form> -->
                <!-- action="/home" ကို action="/user/home" သို့ ပြောင်းပါ -->
                <form action="/user/home" method="get" class="d-flex gap-2">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control shadow-sm"
                        placeholder="Search books by title, author, or genre...">
                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-search"></i> Search</button>
                </form>
                <!-- <form class="d-flex">
                    <input class="form-control me-5" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form> -->
            </div>
        </div>
    </nav>
    <div class="container my-1">

        <!-- Search Bar -->
        <!-- <div class="row justify-content-center mb-4">
            <div class="col-md-8">
                <form action="/home" method="get" class="d-flex gap-2">
                    <input type="text" name="keyword" th:value="${keyword}"
                        class="form-control form-control-lg shadow-sm"
                        placeholder="Search books by title, author, or genre...">
                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-search"></i> Search</button>
                </form>
            </div>
        </div> -->

        <!-- Book Cards Grid -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-4 mb-5">
            <div class="col" th:each="book : ${books}">
                <div class="card h-100 card-custom shadow-sm bg-white">
                    <img th:src="${book.coverImageUrl != null ? book.coverImageUrl : 'https://via.placeholder.com/200x250'}"
                        class="card-img-top book-card-img rounded-top-3" alt="Cover">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div>

                            <div class="row justify-content-between">
                                <span class="col-3 badge bg-primary-subtle text-primary mb-2"
                                    th:text="${book.genre}">Genre</span>
                                <!-- Favorite Toggle Form -->
                                <form class="col-3 mb-2" th:action="@{/user/books/favorite/{id}(id=${book.id})}"
                                    method="post">
                                    <button type="submit" class="btn btn-sm rounded-circle"
                                        th:classappend="${favoriteBookIds.contains(book.id)} ? 'btn-danger text-white' : 'btn-outline-danger'">
                                        <i class="bi"
                                            th:classappend="${favoriteBookIds.contains(book.id)} ? 'bi-heart-fill' : 'bi-heart'"></i>
                                    </button>
                                </form>
                            </div>

                            <h6 class="card-title fw-bold text-dark text-truncate" th:text="${book.title}">Book Title
                            </h6>
                            <p class="card-text text-muted small text-truncate" th:text="${book.author}">Author Name</p>
                        </div>
                        <a th:href="@{/user/books/read/{id}(id=${book.id})}"
                            class="btn btn-outline-primary btn-sm w-100 mt-3 rounded-pill">
                            Read Book
                        </a>

                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(books)}" class="text-center py-5">
            <i class="bi bi-journal-x fs-1 text-muted"></i>
            <p class="text-muted mt-2">No books found.</p>
        </div>

        <!-- Pagination Bar -->
        <nav th:if="${totalPages > 1}" class="d-flex justify-content-center mt-4">
            <ul class="pagination pagination-md">

                <!-- Previous Button -->
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link"
                        th:href="@{/user/home(page=${currentPage - 1}, keyword=${keyword})}">Previous</a>
                </li>

                <!-- Page Number Buttons -->
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link" th:href="@{/user/home(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                </li>

                <!-- Next Button -->
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/user/home(page=${currentPage + 1}, keyword=${keyword})}">Next</a>
                </li>

            </ul>
        </nav>

    </div>

</body>

</html>
