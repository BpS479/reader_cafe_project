<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Reader Cafe</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body.reader-dark-theme {
        background-color: #111827;
        color: #f3f4f6;
        font-family: "Poppins", "Padauk", sans-serif;
      }

      .auth-card {
        background-color: #1f2937;
        border: 1px solid #374151 !important;
      }

      .auth-icon-box {
        width: 65px;
        height: 65px;
        background-color: #fbbf24;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .dark-input {
        background-color: #111827;
        border: 1px solid #374151;
        color: #f3f4f6;
        padding: 10px 14px;
      }

      .dark-input:focus {
        background-color: #111827;
        border-color: #fbbf24;
        color: #ffffff;
        box-shadow: 0 0 0 0.25rem rgba(251, 191, 36, 0.25);
      }

      .dark-input-group {
        background-color: #111827;
        border: 1px solid #374151;
        border-right: none;
      }

      .hover-warning:hover {
        color: #fbbf24 !important;
      }
    </style>
  </head>

  <body
    class="reader-dark-theme d-flex align-items-center justify-content-center min-vh-100 py-4"
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="mb-3 text-start">
            <a
              href="/index"
              class="text-decoration-none text-white small d-inline-flex align-items-center gap-1 hover-warning"
            >
              <i class="fa-solid fa-arrow-left"></i>Back
            </a>
          </div>

          <div class="card auth-card border-0 shadow-lg rounded-4 p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="auth-icon-box mx-auto mb-3 shadow-sm">
                <i class="fa-solid fa-user-shield text-dark fs-3"></i>
              </div>
              <h3 class="fw-bold text-white mb-1">Admin Portal</h3>
              <p class="text-secondary small">Enter with an Admin Account</p>
            </div>

            <div id="alertBox" class="d-none" role="alert"></div>

            <form th:action="@{/login}" method="post" id="adminLoginForm">
              <div class="mb-3 text-start">
                <label class="form-label small text-secondary"
                  >Admin Email</label
                >
                <div class="input-group">
                  <span class="input-group-text dark-input-group"
                    ><i class="fa-solid fa-user text-warning"></i
                  ></span>
                  <input
                    type="email"
                    name="email"
                    id="adminName"
                    class="form-control"
                    placeholder="Enter Admin Email"
                    required
                  />
                </div>
              </div>

              <div class="mb-4 text-start">
                <label class="form-label small text-secondary">Password</label>
                <div class="input-group">
                  <span class="input-group-text dark-input-group"
                    ><i class="fa-solid fa-lock text-warning"></i
                  ></span>
                  <input
                    type="password"
                    name="password"
                    id="adminPassword"
                    class="form-control"
                    placeholder="Enter password"
                    required
                  />
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-warning w-100 rounded-3 text-dark fw-bold py-2 shadow-sm"
              >
                <i class="fa-solid fa-right-to-bracket me-2"></i> Admin Login
                
              </button>
            </form>
          </div>

          <div class="text-center mt-4 text-secondary small">
            &copy; 2026 Reader Cafe. All rights reserved.
          </div>
        </div>
      </div>
    </div>
