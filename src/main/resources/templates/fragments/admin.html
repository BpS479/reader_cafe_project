<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Books - Reader Cafe Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!-- Font Awesome Icons (free) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- Bootstrap Icon -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
     

     
      <!-- Sidebar -->
      <aside th:fragment="aside"  class="sidebar-cafe">
        <div class="logo-section">
          <h2 class="fw-bold"><span class="text-danger text-center rounded-circle bg-warning p-1"><i class="fas fa-user-shield"></i></span> Reader Cafe</h2>
          <p>ADMIN PANEL</p>
        </div>

        <ul class="nav-menu">
          <li class="nav-item">
            <a th:href="@{/admin/admin-dashboard}" class="nav-link">
              <span ><i class="fas fa-dashboard"></i></span>
              <span>Dashboard</span>
            </a>
          </li>
          <li class="nav-item">
            <a th:href="@{/admin/admin-books}" class="nav-link ">
              <span style="color: aliceblue;"><i class="fas fa-book"></i></span>
              <span>Books</span>
            </a>
          </li>
          <li class="nav-item">
            <a th:href="@{/admin/users}" class="nav-link">
              <span style="color: aliceblue;"><i class="fas fa-user-circle"></i></span>
              <span>Users</span>
            </a>
          </li>
          <li class="nav-item">
            <a th:href="@{/admin/premium-requests}" class="nav-link">
              <span style="color: aliceblue;"><i class="fas fa-crown"></i></span>
              <span>Premium Request</span>
            </a>
          </li>
          <li class="nav-item">
            <a th:href="@{/messages/admin-messages}" class="nav-link">
              <span style="color: aliceblue;"><i class="fas fa-message"></i></span>
              <span>Chat</span>
            </a>
          </li>
          <li class="nav-item">
            <a th:href="@{/admin/view-request}" class="nav-link">
              <span style="color: aliceblue;"><i class="fas fa-paper-plane"></i></span>
              <span>Book Request</span>
            </a>
          </li>
        </ul>

        <div class="user-profile">
          <img
            class="book-cover"
            src="https://ui-avatars.com/api/?name=Admin&background=6F4E37&color=fff"
            alt="Admin"
          />
          <h6 style="color: white; margin-top: 0.5rem">Admin</h6>
          <small style="color: rgba(255, 255, 255, 0.7)"
            >admin@readercafe.com</small
          >
        </div>
      </aside>

       
         <!-- //top nav bar -->
        <nav th:fragment="navigation-bar"  class="navbar navbar-expand-lg navbar-light bg-transparent rounded-3">
          <div class="container-fluid">
            <!-- <a class="navbar-brand me-3" href="#"><span class="text-warning"><i class="fas fa-coffee"></i></span> Reader Cafe</a> -->
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item me-3">
                  <a class="nav-link active" aria-current="page" th:href="@{/admin/admin-dashboard}"
                    ><i class="fas fa-dashboard"></i> Dashboard</a
                  >
                </li>
                <li class="nav-item me-3">
                  <a class="nav-link" th:href="@{/admin/admin-books}"><i class="fas fa-book"></i> Book Catalog</a>
                </li>
                <li class="nav-item me-3">
                  <a class="nav-link" th:href="@{/admin/users}"><i class="fas fa-user-circle"></i> Users</a>
                </li>
                <li class="nav-item me-3">
                  <a class="nav-link" th:href="@{/admin/premium-requests}"><i class="fas fa-crown"></i> Premium Request</a>
                </li>
                <li class="nav-item me-3">
                  <a class="nav-link" th:href="@{/admin/view-request}"><i class="fas fa-paper-plane"></i> Requests</a>
                </li>
                <li class="nav-item me-3">
                  <a class="nav-link" th:href="@{/messages/admin-messages}"><i class="fas fa-message"></i> Messages</a>
                </li>
                 
                 
              </ul>
              <form class="d-flex">
                <input
                  class="form-control me-2"
                  type="search"
                  placeholder="Search"
                  aria-label="Search"
                />
                <button class="btn btn-outline-success" type="submit">
                  Search
                </button>
              </form>
            </div>
          </div>
        </nav>

         

        

         
          
          
         

    
    <script th:src="@{/js/main.js}"></script>
  
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
