<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:fragment="common-head">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <!-- FontAwesome icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" th:href="@{/css/style.css}">


    </th:block>

</head>


<body>


    <!-- // Offcanvas Sidebar for Mobile View -->
    <div th:fragment="sidebar" style="  background-color: #111827;" class="offcanvas offcanvas-start" tabindex="-1"
        id="offcanvasWithBackdrop" aria-labelledby="offcanvasWithBackdropLabel">
        <div class="offcanvas-header">

            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div class="brand">
                <div class="logo">
                    <i class="fa-solid fa-mug-hot"></i>
                    <h2>READER CAFE</h2>
                </div>
                <span class="badge"><i class="fa-solid fa-circle"></i> E-READER PORTAL</span>
            </div>

            <nav class="nav-menu">
                <!-- Home Page Link Added Here -->
                <a href="index.html" class="nav-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Home Page</span>
                </a>
                <a th:href="@{/admin/overview}" class="nav-item active">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Overview Console</span>
                </a>
                <a th:href="@{/admin/bookmanagement}" class="nav-item">
                    <i class="fa-solid fa-book"></i>
                    <span>Books Management</span>
                </a>
                <a href="members-database.html" class="nav-item">
                    <i class="fa-solid fa-users"></i>
                    <span>Members Management</span>
                </a>
                <a href="student-messages.html" class="nav-item">
                    <i class="fa-solid fa-envelope"></i>
                    <span>Student Messages</span>
                    <span class="count-badge red">4</span>
                </a>
                <a href="reading-logs.html" class="nav-item">
                    <i class="fa-solid fa-glasses"></i>
                    <span>Reading Logs</span>
                </a>
                <a href="review-requests.html" class="nav-item">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Review Requests</span>
                    <span class="count-badge yellow">15</span>
                </a>
                <a href="analytics-reports.html" class="nav-item">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Analytics Reports</span>
                </a>
                <a href="control-settings.html" class="nav-item">
                    <i class="fa-solid fa-sliders"></i>
                    <span>Control Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-disconnect">
                    <i class="fa-solid fa-power-off"></i> Disconnect Portal
                </button>
            </div>
        </div>
    </div>


    <th:block th:fragment="common-scripts">
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
            integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
            integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
            crossorigin="anonymous"></script>

        <!-- <script th:src="@{/js/bootstrap.bundle.min.js}"></script> -->

        <!-- <script src="app.js"></script> -->
        <script th:src="@{/js/app.js}"></script>
    </th:block>
</body>

</html>
