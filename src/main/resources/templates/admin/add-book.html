      <!-- Main Content -->

        <!-- <div class="breadcrumb">

        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid #e8dcc8;
            padding-bottom: 1rem;
          "
        >
          <h1 class="cafe-header" style="margin: 0">Add New Book</h1>
        </div>

        <div style="max-width: 700px">
          <div class="cafe-card" style="padding: 2rem">
            <form
              action="/admin/books/save"
              method="post"
              enctype="multipart/form-data"
              th:object="${book}"
            >
              <div class="form-group">
                <label class="form-label">Book Title *</label>
                <input
                  type="text"
                  name="title"
                  class="form-control"
                  placeholder="e.g. The Great Gatsby"
                  required
                />
              </div>
              <!-- Premium -->
              <div class="form-check my-3">
                  <input class="form-check-input" type="checkbox" id="isPremium" name="isPremium" th:field="*{premium}">
                  <label class="form-check-label" for="isPremium">
                      👑 Mark as Premium Book
                  </label>
              </div>
               

              <div
                style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem"
              >
                <div class="form-group">
                  <label class="form-label">Author *</label>
                  <input
                    type="text"
                    name="author"
                    class="form-control"
                    placeholder="e.g. F. Scott Fitzgerald"
                    required
                  />
                </div>

                <div class="form-group">
                  <label class="form-label">Category *</label>
                  <select name="genre" class="form-select" required>
                    <option>All Categories</option>
                    <option value="Romance">Romance</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Non-Fiction">Non-Fiction</option>
                    <option value="Science">Science</option>
                    <option value="Sci-fi">Sci-fi</option>
                    <option value="Mystery">Mystery</option>
                    <option value="Technology">Technology</option>
                    <option value="Programming">Programming</option>
                    <option value="Biography">Biography</option>
                    <option value="History">History</option>
                    <option value="Business">Business</option>
                    <option value="Beauty">Beauty</option>
                    <option value="Economic">Economic</option>
                    <option value="Health">Health</option>
                    <option value="Travel">Travel</option>
                    <option value="Nature">Nature</option>
                    <option value="Translate">Translate</option>
                    <option value="Self-improvement">Self-improvement</option>
                    <option value="Literature">Literature</option>
                  </select>
                </div>
              </div>

              <div
                style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem"
              >
                <div class="form-group">
                  <label class="form-label">PDF file</label>
                  <input
                    type="file"
                    name="pdfFile"
                    accept="application/pdf"
                    class="form-control"
                    placeholder="e.g. 978-3-16-148410-0"
                  />
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Description</label>
                <textarea
                  class="form-control"
                  rows="4"
                  placeholder="Enter book summary..."
                ></textarea>
              </div>

              <div class="form-group">
                <label class="form-label">Book Cover Image</label>
                <input
                  type="file"
                  name="imageFile"
                  class="form-control"
                  accept="image/*"
                />
                <small style="color: #999; display: block; margin-top: 0.5rem"
                  >Recommended size: 400x600px. Max 2MB.</small
                >
              </div>

              <div
                style="
                  display: grid;
                  grid-template-columns: 1fr 1fr;
                  gap: 1rem;
                  margin-top: 2rem;
                "
              >
                <a
                  th:href="@{/admin/admin-books}"
                  class="btn-cafe-outline"
                  style="
                    text-align: center;
                    text-decoration: none;
                    padding: 0.75rem;
                  "
                  >Cancel</a
                >
                <button type="submit" class="btn-cafe" style="padding: 0.75rem">
                  Save Book
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
