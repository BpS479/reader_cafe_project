<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Read PDF - [[${book.title}]]</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

    <div class="container py-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 th:text="${book.title}">Book Title</h3>
            <div>
                <!-- Download Button ပါ တပါတည်း ထည့်ပေးထားခြင်း -->
                <a th:href="${book.pdfFileUrl}" class="btn btn-outline-light me-2" download>Download PDF</a>
                <a th:href="@{/admin/overview}" class="btn btn-light">Back to Admin Book Management</a>
            </div>
        </div>

        <!-- PDF Viewer -->
        <div style="height: 85vh;">
            <object th:data="${book.pdfFileUrl}" type="application/pdf" width="100%" height="100%">
                <p>Your browser does not support PDF viewing.
                    <a th:href="${book.pdfFileUrl}">Click here to download the PDF.</a>
                </p>
            </object>
        </div>
    </div>

</body>

</html>
