<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Reader Cafe Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
    <!-- SweetAlert2 CSS & JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!-- Font Awesome 6 (Free) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- Bootstrap Icon -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
     
    <div style="display: flex">
       
      <!-- Sidebar -->
      <div th:replace="~{fragments/admin :: aside}"></div>
       

      <!-- Main Content -->
      <div class="main-content" style="flex: 1">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid #e8dcc8;
            padding-bottom: 1rem;
          "
        >
          <h1 class="cafe-header" style="margin: 0">View Book Requests</h1>
          <div class=" ">
            <form th:action="@{/logout}" method="post">
              <button class="btn btn-danger" type="submit">
                Logout <i class="bi bi-box-arrow-right"></i>
              </button>
            </form> 
          </div>
        </div>

         <!-- top nav bar -->
        <div th:replace="~{fragments/admin :: navigation-bar}"></div>

        
        <div class="container">
          <div class="row g-3">
            <div th:each="req : ${requests}" class="col-6 col-lg-4">
              <div class="card rounded-3" style="width: 18rem">
                <div class="card-header text-white fw-bold" style="background-color: rgb(117, 58, 26);">
                  Requested by : <span>Test</span>
                </div>
                <ul class="list-group list-group-flush">
                  <li class="list-group-item fw-bold border-bottom-0">
                    Book title : <span th:text="${req.bookTitle}">Error</span>
                  </li>
                  <li class="list-group-item fw-bold border-bottom-0">
                    Author : <span th:text="${req.authorName}">Error</span>
                  </li>
                  <li class="list-group-item fw-bold">
                    Notes : <span th:text="${req.message ==null or #strings.isEmpty(req.message.trim()) ? 'Note does not include' : req.message}">Error</span>
                  </li>
                  <li class="list-group-item d-flex justify-content-between">
                    <form th:action="@{/admin/view-request/delete/{id}(id=${req.id})}" method="get">
                      <button type="submit" class="btn btn-danger rounded-circle">
                        <i class="fas fa-trash-can"></i>
                      </button>
                    </form>
                    <form th:action="@{/admin/books/add}" method="get">
                      <button type="submit" class="btn btn-primary rounded-pill">
                        <i class="fas fa-add"></i> Add
                      </button>
                    </form>
                    
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
